name: buttery
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: buttery
      POSTGRES_PASSWORD: buttery
      POSTGRES_DB: buttery
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buttery"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
